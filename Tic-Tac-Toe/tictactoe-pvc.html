<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe - Player vs Computer</title>
    <link rel="stylesheet" href="../tictactoe.css">
</head>
<body>
    <div class="action-btns">
        <a href="tictactoe-mode.html" class="btn-exit">← Back</a>
        <button class="btn-restart" type="button" onclick="resetGame()">🔄 New Game</button>
    </div>
    <main class="container">
        <div class="header">
            <h1>🤖 Player vs Computer</h1>
            <div class="current-player">You are X</div>
            <div class="status" id="status">Your turn (X)</div>
        </div>
        <div class="ttt-board" id="board"></div>
        <div class="message" id="message"></div>
    </main>
    <script src="../tictactoe-ai.js"></script>
</body>
</html>
