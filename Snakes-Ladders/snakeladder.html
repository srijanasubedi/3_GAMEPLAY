<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snakes & Ladders</title>
    <link rel="stylesheet" href="../snakeladder.css">
</head>
<body>
    <div class="header">
        <h1>🎲 Snakes & Ladders</h1>
        <a href="../game.html" class="btn-exit">← Back</a>
        <button class="btn-restart" onclick="resetSL()">🔄 New Game</button>
    </div>

    <div id="sl-winner-banner" class="winner-banner"></div>

    <div class="game-container">
        <div id="sl-svg" style="position: absolute; width: 450px; height: 450px;">
            <svg viewBox="0 0 450 450" width="450" height="450" style="position: absolute; top: 0; left: 0;"></svg>
        </div>
        <div id="sl-board" class="board"></div>
        
        <div class="controls">
            <div id="sl-action-msg" class="action-msg"></div>
            <button class="btn-roll" onclick="rollDice()">🎲 Roll Dice</button>
            
            <div id="flying-dice" class="flying-dice">
                <div id="main-cube" class="cube show-1">
                    <div class="face face-1">1</div>
                    <div class="face face-2">2</div>
                    <div class="face face-3">3</div>
                    <div class="face face-4">4</div>
                    <div class="face face-5">5</div>
                    <div class="face face-6">6</div>
                </div>
            </div>
        </div>
    </div>

    <script src="../snakeladder.js"></script>
</body>
</html>
